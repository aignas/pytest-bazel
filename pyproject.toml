[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-bazel"
version = "0.0.1"
dependencies = [
  "pytest",
]
requires-python = ">=3.9"
authors = [
  {name = "Ignas Anikevicius", email = "pypi@anikevicius.lt"},
]
maintainers = [
  {name = "Ignas Anikevicius", email = "pypi@anikevicius.lt"},
]
description = "A pytest wrapper for bazel"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["pytest", "bazel"]
classifiers = [
  "Development Status :: 4 - Alpha",
  "Programming Language :: Python"
]

[project.optional-dependencies]
all = [
    "pytest-bazel[random]",
    "pytest-bazel[shard]",
]
# Kept for compatibility, sharding is now built-in.
shard = []
random = ["pytest-randomly"]
tests = ["numpy", "pytest-rerunfailures", "pytest-xdist"]
docs = [
    "docutils<0.19",
    "myst-parser",
    "readthedocs-sphinx-ext",
    "sphinx",
    "sphinx-autodoc2",
    "sphinx_rtd_theme",
    "sphinx_rtd_theme>=2.0",
    "typing-extensions"
]

[project.urls]
Homepage = "https://github.com/aignas/pytest-bazel"
Documentation = "https://pytest-bazel.readthedocs.io/"
Repository = "https://github.com/aignas/pytest-bazel.git"
"Bug Tracker" = "https://github.com/aignas/pytest-bazel/issues"
Changelog = "https://github.com/aignas/pytest-bazel/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "B",  # flake-bugbear
    "D",  # pydocstyle
    "E", "E7", "E9",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "ICN",  # flake-import-conventions
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH",  # flake-use-pathlib
    "RUF",  # ruff specific rules
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "UP",  # pyupgrade
]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests}/*" = ["E402", "D"]
"**/*_test.py" = ["D"]
# Examples for the docs, kept short and some fail on purpose.
"examples/**" = ["D", "PLR0133", "PLR2004"]

[tool.pyrefly]
project-includes = ["pytest_bazel", "pkg", "tests"]
# A separate bazel workspace with its own dependencies.
project-excludes = ["tests/integration"]
# Keep in sync with `requires-python`.
python-version = "3.9"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false
