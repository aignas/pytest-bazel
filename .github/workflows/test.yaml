---
name: Test

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: |
          bazel test //...
      - name: Build the release wheel
        run: ./pkg/build.sh 0.0.0 dist

  python-versions:
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the default and is tested by the `build` job.
        python: ["3.9", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test with Python ${{ matrix.python }}
        env:
          PYTHON: ${{ matrix.python }}
        run: bazel test //... "--@rules_python//python/config_settings:python_version=$PYTHON"

  # rules_python needs Python 3.9+ to run a py_test, so test 3.8 without Bazel.
  python-3_8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Test with Python 3.8
        run: >-
          ./dev/test_without_bazel.sh 3.8
          tests/main/test_filter.py
          tests/main/test_pytest_base.py
          tests/junit/test_junit.py
          tests/tmpdir/test_tmpdir.py
