---
name: Test

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: |
          bazel test //...
      # Tagged manual, as it runs bazel in bazel. Its workspace pins Python 3.14,
      # so it runs only here and not for each Python version.
      - name: Test installing the wheel in a bazel workspace
        run: bazel test //tests:integration_test
      - name: Build the release wheel
        run: ./pkg/build.sh 0.0.0 dist

  python-versions:
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the default and is tested by the `build` job.
        python: ["3.9", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test with Python ${{ matrix.python }}
        env:
          PYTHON: ${{ matrix.python }}
        run: bazel test //... "--@rules_python//python/config_settings:python_version=$PYTHON"

  bazel-versions:
    strategy:
      fail-fast: false
      matrix:
        # The latest releases, the other jobs use the one in .bazelversion.
        bazel: ["8.x", "9.x", "10.0.0rc2"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Only the latest Python, the `python-versions` job tests the others.
      - name: Test with Bazel ${{ matrix.bazel }}
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: bazel test //... "--@rules_python//python/config_settings:python_version=3.15"

  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the hooks in .pre-commit-config.yaml
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  # The docs in docs/features show the output of the examples in examples/.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the docs are up to date
        run: bazel run //dev/update_docs -- --check
